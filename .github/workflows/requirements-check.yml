name: requirements-check

# Gate for every pull request that touches requirements: standard structure, traces, evidence links,
# per-feature layout, unique doc IDs, an up-to-date docs/requirements/INDEX.md, and a version bump
# on every document whose content changed.
on:
  pull_request:
    paths:
      - "docs/requirements/**"
      - ".claude/skills/requirements-docs/**"
  push:
    branches: [main]
    paths:
      - "docs/requirements/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Structure, traces, links, layout, index
        run: |
          if [ -d docs/requirements ]; then
            python3 .claude/skills/requirements-docs/scripts/docver.py check docs/requirements
          else
            echo "no docs/requirements yet"
          fi
      - name: Every changed document was version-bumped
        if: github.event_name == 'pull_request' && hashFiles('docs/requirements/**') != ''
        run: python3 .claude/skills/requirements-docs/scripts/docver.py bumpcheck --base "origin/${{ github.base_ref }}" docs/requirements
