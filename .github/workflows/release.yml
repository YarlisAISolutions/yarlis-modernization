name: release

# Publishes @l2m/cli to npm when package.json on main carries a version npm doesn't have yet.
# Bump the version in a PR; merging it publishes and tags v<version>. The org webhook announces the release.
#
# Auth: trusted publishing (OIDC) when the repository variable NPM_TRUSTED_PUBLISHING is 'true' (configure it on
# npmjs.com for @l2m/cli → this repository → release.yml); otherwise the NPM_TOKEN secret, written by Yarlis Keep.
# The very first publish needs the token: trusted publishing can only be set up once the package exists.
# Without either it skips with a notice. The repository is public, so every publish carries provenance.

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@11.5.1
      - id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "$name@$version is already on npm"
          elif [ -z "$NPM_TOKEN" ] && [ "$TRUSTED" != 'true' ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no NPM_TOKEN and NPM_TRUSTED_PUBLISHING is not true; not publishing $name@$version"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        if: steps.check.outputs.publish == 'true'
        run: |
          bash tests/selftest.sh
          node --test test/*.test.js
          bash scripts/check-pack.sh
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          # Empty under trusted publishing: npm then uses the OIDC token. Check on the first OIDC publish that
          # setup-node's .npmrc line (_authToken=${NODE_AUTH_TOKEN}) with an empty value doesn't shadow OIDC.
          NODE_AUTH_TOKEN: ${{ vars.NPM_TRUSTED_PUBLISHING != 'true' && secrets.NPM_TOKEN || '' }}
        run: npm publish --provenance --access public
      - name: Tag
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"
