name: Copilot setup steps

# Prepares the environment for the Copilot cloud agent so it can run the skill scripts.
# The job name must be exactly copilot-setup-steps.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history: commit SHAs for evidence permalinks
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22          # optional: lets the agent run `npx @l2m/cli` as well as the scripts
      - name: Smoke-test the skill scripts
        run: |
          python3 .claude/skills/requirements-docs/scripts/docver.py --help > /dev/null
          python3 .claude/skills/legacy-code-analysis/scripts/inventory.py --help > /dev/null
          python3 .claude/skills/mainframe-modernization/scripts/mapgen.py --help > /dev/null
